[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fomc-signal"
version = "0.1.0"
description = "Score FOMC statements with LLMs and test the scores as rates and FX signals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yehia Dawoud" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "tabulate>=0.9",
]

[project.optional-dependencies]
roberta = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
fomc-signal = "fomc_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
